[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cypher-lang"
version = "0.1.0"
description = "Minimalist programming language with 8 primitives"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Daouda Abdoul Anzize", email = "nexusstudio100@gmail.com"}
]
keywords = ["programming-language", "compiler", "interpreter", "minimalist"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.scripts]
cypher = "cypher:cli"

[project.urls]
Homepage = "https://github.com/tryboy869/cypher"
Documentation = "https://github.com/tryboy869/cypher/tree/main/docs"
Repository = "https://github.com/tryboy869/cypher"
Issues = "https://github.com/tryboy869/cypher/issues"
